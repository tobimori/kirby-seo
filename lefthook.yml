pre-commit:
  piped: true
  commands:
    build:
      priority: 1
      run: pnpm run build && git add index.css index.js
    eslint:
      priority: 2
      glob: "src/*.{js,vue}"
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true
    format:
      priority: 2
      glob: "src/*.{js,vue}"
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    mago:
      priority: 2
      glob: "*.php"
      exclude:
        - "vendor/**"
      run: mago fmt {staged_files}
      stage_fixed: true
