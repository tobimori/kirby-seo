name: ci

on:
  push:
  pull_request:

jobs:
  lint-and-format:
    name: lint, format, and analyze
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup php
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer

      - name: install php dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: install pnpm
        uses: pnpm/action-setup@v3

      - name: install node dependencies
        run: pnpm install --frozen-lockfile

      - name: run eslint
        run: pnpm run lint

      - name: check oxfmt formatting
        run: pnpm exec oxfmt

      - name: check mago formatting
        run: vendor/bin/mago fmt --check

      - name: run mago lint
        if: success() || failure()
        run: vendor/bin/mago lint

      - name: run mago analyze
        if: success() || failure()
        run: vendor/bin/mago analyze
